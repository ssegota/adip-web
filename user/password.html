<!DOCTYPE html>
<html lang="hr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Promjena lozinke | Pulska Zvjezdarnica</title>
    <link rel="icon" href="../sites/all/themes/black_hole/logo.png" type="image/png">
    <link rel="stylesheet" href="../css/modern.css?v=20260928">
    <style>
        .pw-wrap { max-width: 440px; margin: 0 auto; padding: 6rem 1rem 3rem; }
        .pw-card { background: var(--bg-card); border: 1px solid rgba(255, 255, 255, .08); border-radius: 16px; padding: 2rem; }
        .pw-card h1 { font-size: 1.5rem; margin-bottom: .5rem; }
        .pw-card p { color: var(--text-secondary); margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1rem; }
        #pw-msg { min-height: 1.4em; margin: .5rem 0 1rem; }
        .pw-links { margin-top: 1.25rem; display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
        .pw-links a { color: var(--text-secondary); }
        .hidden { display: none !important; }
    </style>
</head>

<body>
    <main class="pw-wrap">
        <div class="pw-card">
            <h1>Promjena lozinke</h1>
            <p id="pw-intro">Administracija stranice adip.hr</p>

            <div id="pw-login-needed" class="hidden">
                <p>Za promjenu lozinke morate biti prijavljeni. Prijavite se na
                    <a href="../index.html">naslovnici</a> (gumb »Prijava« u izborniku) pa se vratite ovamo.</p>
            </div>

            <form id="pw-form" class="hidden" autocomplete="on">
                <input type="text" id="pw-user" autocomplete="username" class="hidden" readonly>
                <div class="form-group">
                    <label class="form-label" for="pw-current">Trenutna lozinka</label>
                    <input type="password" class="form-input" id="pw-current" autocomplete="current-password" required maxlength="200">
                </div>
                <div class="form-group">
                    <label class="form-label" for="pw-new">Nova lozinka (najmanje 10 znakova)</label>
                    <input type="password" class="form-input" id="pw-new" autocomplete="new-password" required minlength="10" maxlength="200">
                </div>
                <div class="form-group">
                    <label class="form-label" for="pw-new2">Ponovite novu lozinku</label>
                    <input type="password" class="form-input" id="pw-new2" autocomplete="new-password" required minlength="10" maxlength="200">
                </div>
                <div id="pw-msg" role="status"></div>
                <button type="submit" class="btn btn--primary" style="width: 100%;">Promijeni lozinku</button>
            </form>

            <div class="pw-links">
                <a href="../index.html">← Na naslovnicu</a>
            </div>
        </div>
    </main>

    <script>
        (function () {
            var form = document.getElementById('pw-form');
            var msg = document.getElementById('pw-msg');
            var needLogin = document.getElementById('pw-login-needed');

            function show(text, ok) {
                msg.textContent = text;
                msg.style.color = ok ? '#34d399' : '#f87171';
            }

            fetch('/api/session', { cache: 'no-store', credentials: 'same-origin' })
                .then(function (r) { return r.json(); })
                .then(function (d) {
                    if (d && d.authenticated) {
                        document.getElementById('pw-user').value = d.username;
                        document.getElementById('pw-intro').textContent = 'Korisnik: ' + d.username;
                        form.classList.remove('hidden');
                    } else {
                        try { localStorage.removeItem('adip_token'); } catch (e) { }
                        needLogin.classList.remove('hidden');
                    }
                })
                .catch(function () { needLogin.classList.remove('hidden'); });

            form.addEventListener('submit', function (e) {
                e.preventDefault();
                var cur = document.getElementById('pw-current').value;
                var n1 = document.getElementById('pw-new').value;
                var n2 = document.getElementById('pw-new2').value;
                if (n1 !== n2) return show('Nove lozinke se ne podudaraju.', false);
                if (n1.length < 10) return show('Nova lozinka mora imati barem 10 znakova.', false);
                show('…', true);
                fetch('/api/password', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ currentPassword: cur, newPassword: n1 })
                }).then(function (r) {
                    return r.json().catch(function () { return {}; }).then(function (d) {
                        if (r.ok && d.success) {
                            form.reset();
                            show('Lozinka je promijenjena. Ostale prijave (drugi preglednici) su odjavljene.', true);
                        } else if (r.status === 401) {
                            try { localStorage.removeItem('adip_token'); } catch (e) { }
                            form.classList.add('hidden');
                            needLogin.classList.remove('hidden');
                        } else {
                            show(d.message || 'Promjena nije uspjela.', false);
                        }
                    });
                }).catch(function () { show('Server nije dostupan.', false); });
            });
        })();
    </script>
</body>

</html>
