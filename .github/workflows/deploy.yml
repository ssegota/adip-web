name: Deploy na adip.hr

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  APP_DIR: /home/adip/repositories/adip-web
  NODE_VENV: /home/adip/nodevenv/repositories/adip-web/20/bin/activate

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: SSH ključ
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Rsync na server
        run: |
          rsync -rlptz --checksum --itemize-changes \
            --exclude-from=deploy/rsync-exclude.txt \
            ./ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:$APP_DIR/"

      - name: npm install (ako se package.json promijenio)
        run: |
          if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -qE '^package(-lock)?\.json$'; then
            ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              "source $NODE_VENV && cd $APP_DIR && npm install --omit=dev"
          else
            echo "package.json nepromijenjen, preskačem."
          fi

      - name: Restart Node aplikacije (Passenger)
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "mkdir -p $APP_DIR/tmp && touch $APP_DIR/tmp/restart.txt"

      - name: Provjera
        run: |
          sleep 5
          code=$(curl -s -o /dev/null -w '%{http_code}' https://adip.hr/)
          echo "https://adip.hr/ -> HTTP $code"
          test "$code" = 200
