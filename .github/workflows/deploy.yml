name: Deploy na adip.hr

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Hosting nema shell, a FTP je blokiran za GitHub IP-jeve - deploy ide preko SFTP-a.
      - name: SFTP deploy
        env:
          SSH_TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          SSH_KEY=~/.ssh/deploy_key deploy/sftp-deploy.sh

      - name: Upozorenje za package.json
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -qE '^package(-lock)?\.json$'; then
            echo "::warning::package.json promijenjen - pokreni 'Run NPM Install' u cPanel -> Setup Node.js App"
          fi

      - name: Provjera
        run: |
          sleep 10
          code=$(curl -s -o /dev/null -w '%{http_code}' https://adip.hr/)
          echo "https://adip.hr/ -> HTTP $code"
          test "$code" = 200
