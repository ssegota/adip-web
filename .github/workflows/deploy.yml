name: Deploy na adip.hr

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Hosting nema shell pristup, pa se deploya preko FTPS-a.
      # Mape koje puni admin panel se ne diraju (ni upload ni brisanje).
      - name: FTPS upload
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: repositories/adip-web/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            deploy/**
            **/node_modules/**
            deploy.zip
            tmp/**
            data/**
            galerija/**
            galerija-slika/**
            aktivnosti-slike/**
            radovi-files/**
            downloads-files/**

      - name: Restart Node aplikacije (Passenger)
        run: |
          mkdir -p tmp && date > tmp/restart.txt
          curl -sS --ssl-reqd --ftp-create-dirs -T tmp/restart.txt \
            -u "${{ secrets.FTP_USER }}:${{ secrets.FTP_PASSWORD }}" \
            "ftp://${{ secrets.FTP_HOST }}/repositories/adip-web/tmp/restart.txt"

      - name: Upozorenje za package.json
        run: |
          if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -qE '^package(-lock)?\.json$'; then
            echo "::warning::package.json promijenjen - pokreni 'Run NPM Install' u cPanel -> Setup Node.js App"
          fi

      - name: Provjera
        run: |
          sleep 10
          code=$(curl -s -o /dev/null -w '%{http_code}' https://adip.hr/)
          echo "https://adip.hr/ -> HTTP $code"
          test "$code" = 200
