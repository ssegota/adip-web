<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Lovac na Asteroide</title><style>:root{color-scheme:dark}body{margin:0;font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#0b0b0b;color:#eaeaea;display:grid;place-items:center;min-height:100vh}.wrap{width:min(2200px,96vw);padding:16px}h1{font-size:1.1rem;margin:0 0 8px;color:#f2f2f2}.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.canvases{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:12px}canvas{background:#000;border:2px solid #fff;box-shadow:0 0 0 1px #222,0 6px 18px rgba(0,0,0,.6)}.stats{display:flex;gap:18px;align-items:center;margin:10px 0 4px}.badge{padding:4px 8px;border-radius:999px;font-weight:700}.ok{background:#143;color:#9f9}.err{background:#411;color:#fbb}.msg{min-height:1.4em;font-weight:600}.tiny{opacity:.7;font-size:.9rem}code{background:#111;padding:2px 6px;border-radius:6px}</style></head><body><div class="wrap"><h1>Lovac na Asteroide</h1><div class="stats"><span class="badge ok">Correct: <span id="score-ok">0</span></span> <span class="badge err">Wrong: <span id="score-err">0</span></span> <span class="msg" id="msg"></span></div><div class="tiny">Simulacija traženja asteroida u polju zvijezda! Usporedi dvije slike - asteroid je ona točka koja se pomakla! Kada je nađeš, na bilo kojoj slici klikni na asteroid! Igra će pratiti tvoje uspjehe (i neuspjehe) dok ne osvježiš stranicu!</div><div class="canvases"><canvas id="c1" width="300" height="300" aria-label="Image 1"></canvas><canvas id="c2" width="300" height="300" aria-label="Image 2 (click the dot here)"></canvas></div></div><script>const CONFIG={WIDTH:300,HEIGHT:300,STAR_COUNT_MIN:75,STAR_COUNT_MAX:125,STAR_RADIUS_MIN:.5,STAR_RADIUS_MAX:1.5,DOT_RADIUS:3,DOT_COLOR:{r:200,g:200,b:200},CLICK_TOLERANCE:20,EDGE_MARGIN:4,REGEN_DELAY_MS:800},rand=(t,e)=>Math.random()*(e-t)+t,randi=(t,e)=>Math.floor(rand(t,e+1)),dist2=(t,e,r,n)=>(r-t)*(r-t)+(n-e)*(n-e);function rgb({r:t,g:e,b:r}){return`rgb(${0|t}, ${0|e}, ${0|r})`}function pickNonOverlappingPoint(t,e){const r=CONFIG.EDGE_MARGIN+e+CONFIG.CLICK_TOLERANCE;for(let n=0;n<5e3;n++){const n=rand(r,CONFIG.WIDTH-r),o=rand(r,CONFIG.HEIGHT-r);let a=!0;for(const r of t){const t=r.r+e+1;if(dist2(n,o,r.x,r.y)<t*t){a=!1;break}}if(a)return{x:n,y:o}}return{x:rand(r,CONFIG.WIDTH-r),y:rand(r,CONFIG.HEIGHT-r)}}let stars=[],dot1={x:0,y:0},dot2={x:0,y:0},scoreOK=0,scoreERR=0,locked=!1;const c1=document.getElementById("c1"),c2=document.getElementById("c2"),g1=c1.getContext("2d"),g2=c2.getContext("2d"),msgEl=document.getElementById("msg"),scoreOkEl=document.getElementById("score-ok"),scoreErrEl=document.getElementById("score-err");function clearCanvas(t){t.fillStyle="#000",t.fillRect(0,0,CONFIG.WIDTH,CONFIG.HEIGHT)}function drawStars(t){t.save(),t.fillStyle="#fff";for(const e of stars)t.beginPath(),t.arc(e.x,e.y,e.r,0,2*Math.PI),t.fill();t.restore()}function drawDot(t,e){t.save(),t.fillStyle=rgb(CONFIG.DOT_COLOR),t.beginPath(),t.arc(e.x,e.y,CONFIG.DOT_RADIUS,0,2*Math.PI),t.fill(),t.restore()}function generateStars(){const t=randi(CONFIG.STAR_COUNT_MIN,CONFIG.STAR_COUNT_MAX),e=CONFIG.EDGE_MARGIN,r=[];for(let n=0;n<t;n++)r.push({x:rand(e,CONFIG.WIDTH-e),y:rand(e,CONFIG.HEIGHT-e),r:rand(CONFIG.STAR_RADIUS_MIN,CONFIG.STAR_RADIUS_MAX)});return r}function regenerate(){stars=generateStars(),dot1=pickNonOverlappingPoint(stars,CONFIG.DOT_RADIUS);do{dot2=pickNonOverlappingPoint(stars,CONFIG.DOT_RADIUS)}while(dist2(dot1.x,dot1.y,dot2.x,dot2.y)<4*CONFIG.DOT_RADIUS*(4*CONFIG.DOT_RADIUS));clearCanvas(g1),clearCanvas(g2),drawStars(g1),drawStars(g2),drawDot(g1,dot1),drawDot(g2,dot2),msg("")}function canvasClickHandler(t,e){if(locked)return;const r=t.target.getBoundingClientRect(),n=(t.clientX-r.left)*(t.target.width/r.width),o=(t.clientY-r.top)*(t.target.height/r.height),a=2===e?dot2:dot1,c=CONFIG.DOT_RADIUS+CONFIG.CLICK_TOLERANCE;dist2(n,o,a.x,a.y)<=c*c?(scoreOK++,updateScores(),msg("victory"),locked=!0,setTimeout(()=>{locked=!1,regenerate()},CONFIG.REGEN_DELAY_MS)):(scoreERR++,updateScores(),msg("miss"))}function msg(t){msgEl.textContent=t,msgEl.style.color="victory"===t?"#9f9":"miss"===t?"#f88":"#eaeaea"}function updateScores(){scoreOkEl.textContent=String(scoreOK),scoreErrEl.textContent=String(scoreERR)}c1.addEventListener("click",t=>canvasClickHandler(t,1)),c2.addEventListener("click",t=>canvasClickHandler(t,2)),regenerate()</script></body></html>
