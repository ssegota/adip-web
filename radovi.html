<!DOCTYPE html>
<html lang="hr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radovi - Astronomsko društvo "Istra" Pula</title>
    <link rel="shortcut icon" href="sites/all/themes/black_hole/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/modern.css">
    <style>
        /* Specific styles for upload form */
        .admin-panel {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-md);
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 0.75rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-glass);
            background: rgba(0, 0, 0, 0.3);
            color: var(--text-primary);
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <!-- Header injected by main.js/desktop nav or manually here if needed. 
       Since this is a new modern page, we can use the same structure as aktivnosti.html 
       OR use inject-header strategy. Since index.html has hardcoded header, 
       we'll copy the header structure for consistency implicitly via main.js? 
       No, main.js does NOT inject header. inject-header.js does. 
       Let's stick to the convention: hardcode header for modern pages or include inject-header.js. 
       Legacy pages use inject-header.js. Modern pages (aktivnosti.html) have it hardcoded.
       I will hardcode it here for stability.
  -->

    <header class="header">
        <div class="menu-toggle" id="menu-toggle">
            <span></span><span></span><span></span>
        </div>

        <a href="index.html" class="header__logo">
            <img src="sites/all/themes/black_hole/logo.png" alt="ADIP Logo">
            <div>
                <div class="header__title">Pulska Zvjezdarnica</div>
                <div class="header__subtitle">Astronomsko društvo "Istra" Pula</div>
            </div>
        </a>

        <nav class="nav" id="main-nav">
            <button class="nav__close" id="nav-close">✕</button>
            <a href="index.html" class="nav__link">🏠 Naslovna</a>
            <a href="aktivnosti.html" class="nav__link">📅 Aktivnosti</a>
            <a href="galerija-slika.html" class="nav__link">🖼️ Galerija</a>
            <a href="povijest-zvjezdarnice.html" class="nav__link">📜 Povijest</a>
            <a href="posjet-pulskoj-zvjezdarnici.html" class="nav__link">🔭 Posjeti</a>
            <a href="radovi.html" class="nav__link active">📚 Radovi</a>
            <a href="astronomsko-drustvo-istra-pula.html" class="nav__link">ℹ️ O nama</a>
            <div class="nav__spacer"></div>
            <button class="btn btn--secondary nav__login" id="sidebar-login-btn">Prijava</button>
        </nav>
        <div class="nav-overlay" id="nav-overlay"></div>
        <div class="user-controls"><button class="lang-toggle" id="lang-toggle">EN</button></div>
    </header>

    <div class="content" style="padding-top: 100px;">
        <section class="section">
            <div class="container">
                <div class="section__header">
                    <h2 class="section__title">Znanstveni i stručni <span class="text-gradient">radovi</span></h2>
                    <p class="section__subtitle">Publikacije, članci i istraživanja naših članova</p>
                </div>

                <!-- Admin Upload Form -->
                <div class="admin-panel hidden" id="radovi-admin-panel">
                    <h3>Dodaj novi rad</h3>
                    <form id="radovi-upload-form">
                        <div class="grid grid--2">
                            <div class="form-group">
                                <label>Naslov rada</label>
                                <input type="text" name="title" required>
                            </div>
                            <div class="form-group">
                                <label>Autori</label>
                                <input type="text" name="authors" placeholder="npr. I. Ivić, M. Marić" required>
                            </div>
                        </div>

                        <div class="grid grid--2">
                            <div class="form-group">
                                <label>Godina</label>
                                <input type="number" name="year" value="2024" required>
                            </div>
                            <div class="form-group">
                                <label>Tip unosa</label>
                                <select name="type" id="upload-type-select">
                                    <option value="link">Web Poveznica</option>
                                    <option value="pdf">PDF Datoteka</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group" id="link-input-group">
                            <label>Poveznica (URL)</label>
                            <input type="url" name="link" placeholder="https://...">
                        </div>

                        <div class="form-group hidden" id="file-input-group">
                            <label>PDF Datoteka</label>
                            <input type="file" name="file" accept="application/pdf">
                        </div>

                        <div class="form-group">
                            <label>Sažetak (Abstract)</label>
                            <textarea name="abstract" rows="3"></textarea>
                        </div>

                        <button type="submit" class="btn btn--primary">Dodaj Rad</button>
                        <p id="radovi-message" style="margin-top: 0.5rem; font-weight: bold;"></p>
                    </form>
                </div>

                <!-- List -->
                <div class="grid grid--2" id="radovi-list">
                    <!-- Loaded via JS -->
                    <p style="color: var(--text-secondary);">Učitavanje radova...</p>
                </div>

            </div>
        </section>
    </div>

    <script src="js/main.js"></script>
    <script>
        // Toggle inputs based on type
        const typeSelect = document.getElementById('upload-type-select');
        const linkGroup = document.getElementById('link-input-group');
        const fileGroup = document.getElementById('file-input-group');

        if (typeSelect) {
            typeSelect.addEventListener('change', () => {
                if (typeSelect.value === 'pdf') {
                    linkGroup.classList.add('hidden');
                    fileGroup.classList.remove('hidden');
                    fileGroup.querySelector('input').required = true;
                    linkGroup.querySelector('input').required = false;
                } else {
                    linkGroup.classList.remove('hidden');
                    fileGroup.classList.add('hidden');
                    fileGroup.querySelector('input').required = false;
                    linkGroup.querySelector('input').required = true;
                }
            });
        }

        // Check login status to show/hide admin panel
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('adip_token');
            const adminPanel = document.getElementById('radovi-admin-panel');
            if (token && adminPanel) {
                adminPanel.classList.remove('hidden');
            }
        });
    </script>
</body>

</html>
